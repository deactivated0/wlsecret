<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #0d1117; rx: 12px; }
      .header-bg { fill: #161b22; }
      .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13.5px; fill: #e6edf3; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0883e; font-weight: bold; }
      .flag { fill: #79c0ff; }
      .string { fill: #7ee787; }
      .comment { fill: #8b949e; font-style: italic; }
      .success { fill: #3fb950; font-weight: bold; }
      .key { fill: #d2a8ff; }
      .val { fill: #a5d6ff; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: sans-serif; font-size: 12px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="900" height="520" class="window-bg" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Header -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 888 0 C 894.627 0 900 5.373 900 12 L 900 38 L 0 38 Z" class="header-bg" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  <text x="450" y="23" class="title">wlsecret-cli — System Keyring Terminal Interface</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 65)" class="terminal-text">
    <!-- Command 1: list-collections -->
    <text y="0"><tspan class="prompt">❯ </tspan><tspan class="cmd">wlsecret-cli</tspan> <tspan class="flag">list-collections</tspan></text>
    <text y="24" fill="#8b949e">ALIAS            LABEL            DBUS OBJECT PATH                                STATUS</text>
    <text y="44"><tspan class="key">login</tspan>            Login            /org/freedesktop/secrets/collection/login       <tspan class="success">[unlocked]</tspan></text>
    <text y="64"><tspan class="key">default_keyring</tspan>  Default_Keyring  /org/freedesktop/secrets/collection/default_keyring  <tspan class="success">[unlocked]</tspan></text>
    <text y="84"><tspan class="key">session</tspan>          session          /org/freedesktop/secrets/collection/session          <tspan fill="#58a6ff">[temporary]</tspan></text>

    <!-- Command 2: store -->
    <text y="124"><tspan class="prompt">❯ </tspan><tspan class="cmd">echo</tspan> <tspan class="string">"demo_token_secret_example"</tspan> | <tspan class="cmd">wlsecret-cli</tspan> <tspan class="flag">store</tspan> <tspan class="string">'GitHub CLI Token'</tspan> service=github account=developer</text>
    <text y="148" class="success">✓ Item successfully stored in keyring [login] (0.28ms latency)</text>

    <!-- Command 3: lookup -->
    <text y="188"><tspan class="prompt">❯ </tspan><tspan class="cmd">wlsecret-cli</tspan> <tspan class="flag">lookup</tspan> service=github account=developer</text>
    <text y="212" class="val">demo_token_secret_example</text>

    <!-- Command 4: search JSON -->
    <text y="252"><tspan class="prompt">❯ </tspan><tspan class="cmd">wlsecret-cli</tspan> <tspan class="flag">search --json</tspan> service=github</text>
    <text y="276" fill="#79c0ff">[</text>
    <text y="296" fill="#e6edf3">  {</text>
    <text y="316" fill="#e6edf3">    <tspan class="key">"label"</tspan>: <tspan class="string">"GitHub CLI Token"</tspan>,</text>
    <text y="336" fill="#e6edf3">    <tspan class="key">"attributes"</tspan>: { <tspan class="key">"service"</tspan>: <tspan class="string">"github"</tspan>, <tspan class="key">"account"</tspan>: <tspan class="string">"developer"</tspan> },</text>
    <text y="356" fill="#e6edf3">    <tspan class="key">"created"</tspan>: <tspan class="val">1740000000</tspan>,</text>
    <text y="376" fill="#e6edf3">    <tspan class="key">"locked"</tspan>: <tspan fill="#ff7b72">false</tspan></text>
    <text y="396" fill="#e6edf3">  }</text>
    <text y="416" fill="#79c0ff">]</text>
  </g>
</svg>
