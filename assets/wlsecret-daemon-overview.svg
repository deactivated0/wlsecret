<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #0d1117; rx: 12px; }
      .header-bg { fill: #161b22; }
      .card-bg { fill: #161b22; rx: 8px; stroke: #30363d; stroke-width: 1px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #58a6ff; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .text-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
      .highlight { fill: #3fb950; font-weight: bold; }
      .warn { fill: #f0883e; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .bar-bg { fill: #21262d; rx: 4px; }
      .bar-wlsecret { fill: #238636; rx: 4px; }
      .bar-gnome { fill: #da3633; rx: 4px; }
    </style>
  </defs>

  <rect width="900" height="480" class="window-bg" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 888 0 C 894.627 0 900 5.373 900 12 L 900 38 L 0 38 Z" class="header-bg" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  <text x="450" y="23" fill="#8b949e" font-family="sans-serif" font-size="12px" text-anchor="middle">wlsecret-daemon — Performance Architecture &amp; Memory Metrics</text>

  <!-- Left Card: Memory Comparison -->
  <g transform="translate(30, 60)">
    <rect width="400" height="380" class="card-bg" />
    <text x="24" y="36" class="text-title">Resident Memory Usage (RSS)</text>
    <text x="24" y="60" class="text-body">Comparison under steady-state Secret Service workload</text>

    <!-- wlsecret-daemon -->
    <text x="24" y="110" class="text-mono">wlsecret-daemon (Rust, LTO, Zero-Copy)</text>
    <rect x="24" y="122" width="352" height="24" class="bar-bg" />
    <rect x="24" y="122" width="90" height="24" class="bar-wlsecret" />
    <text x="125" y="139" class="text-mono highlight">7.2 MB (-74.3%)</text>

    <!-- gnome-keyring -->
    <text x="24" y="180" class="text-mono">gnome-keyring-daemon (C / GObject)</text>
    <rect x="24" y="192" width="352" height="24" class="bar-bg" />
    <rect x="24" y="192" width="352" height="24" class="bar-gnome" />
    <text x="260" y="209" class="text-mono" fill="#ff7b72">28.0 MB</text>

    <!-- Key Metrics List -->
    <text x="24" y="260" class="text-body">• Binary Size: <tspan class="text-mono highlight">4.3 MB</tspan> (stripped fat LTO, vs 12.8 MB)</text>
    <text x="24" y="290" class="text-body">• Search Crypto: <tspan class="text-mono highlight">O(1)</tspan> attribute HMAC caching</text>
    <text x="24" y="320" class="text-body">• Key Exchange: <tspan class="text-mono highlight">6.5x faster</tspan> Montgomery modpow</text>
    <text x="24" y="350" class="text-body">• IPC Overhead: <tspan class="text-mono highlight">0</tspan> socket churn via OnceCell pooling</text>
  </g>

  <!-- Right Card: D-Bus Daemon Status -->
  <g transform="translate(470, 60)">
    <rect width="400" height="380" class="card-bg" />
    <text x="24" y="36" class="text-title">D-Bus Endpoint &amp; Compatibility</text>
    <text x="24" y="60" class="text-body">FreeDesktop Secret Service &amp; libsecret provider</text>

    <g transform="translate(24, 90)">
      <text y="0" class="text-mono" fill="#d2a8ff">org.freedesktop.secrets</text>
      <text y="20" class="text-body">Path: /org/freedesktop/secrets</text>
      <text y="40" class="text-body">Status: <tspan class="highlight">Active &amp; Serving Requests</tspan></text>
      
      <text y="80" class="text-mono" fill="#d2a8ff">org.freedesktop.Secret.Collection</text>
      <text y="100" class="text-body">Path: /org/freedesktop/secrets/collection/login</text>
      <text y="120" class="text-body">State: <tspan class="highlight">Auto-Unlocked (Zero-Config)</tspan></text>

      <text y="160" class="text-mono" fill="#d2a8ff">Client Integration Matrix</text>
      <text y="180" class="text-body">✓ GitHub CLI (`gh`) <tspan fill="#3fb950">[Active Keyring]</tspan></text>
      <text y="200" class="text-body">✓ Git (`git-credential-libsecret`)</text>
      <text y="220" class="text-body">✓ Chrome / Brave / Firefox / Waterfox</text>
      <text y="240" class="text-body">✓ VS Code / VSCodium Secrets</text>
    </g>
  </g>
</svg>
